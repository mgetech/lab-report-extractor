[project]
name = "lab-report-extractor"
version = "0.1.0"
description = "Python extraction engine: DI -> LLM -> validated structured JSON"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "azure-ai-documentintelligence==1.0.2",
    "openai==2.44.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["../../tests/python"]
pythonpath = ["."]
markers = [
    "integration: hits real Azure services with live credentials; run locally only, excluded from CI",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["."]
