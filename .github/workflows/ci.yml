name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor package (+ dev deps)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Test + coverage
        run: pytest --cov=. --cov-report=term-missing

  dotnet-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LabReportExtractor.slnx

      - name: Build
        run: dotnet build LabReportExtractor.slnx --no-restore --configuration Release

      - name: Format check (dotnet format)
        run: dotnet format LabReportExtractor.slnx --verify-no-changes

      - name: Test + coverage
        run: dotnet test LabReportExtractor.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"