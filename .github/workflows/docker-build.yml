name: Docker Build

# Insurance that a clean `docker-compose build` still works, without costing anything on
# routine commits: runs on every PR to main, or on push only when Docker-relevant files
# change (Dockerfiles, compose file, or the dependency manifests each image installs from).
on:
  pull_request:
    branches: [main]
  push:
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "**/requirements.txt"
      - "src/extractor/pyproject.toml"
      - "**/*.csproj"
      - "**/.dockerignore"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write placeholder .env
        # docker-compose.yml interpolates POSTGRES_* even for `build` (not just `up`);
        # no real secrets needed, this just keeps compose from warning on unset vars.
        run: |
          cat > .env <<'EOF'
          AZURE_DI_ENDPOINT=https://placeholder.cognitiveservices.azure.com/
          AZURE_DI_KEY=placeholder
          AZURE_OPENAI_ENDPOINT=https://placeholder.openai.azure.com/
          AZURE_OPENAI_API_KEY=placeholder
          AZURE_OPENAI_DEPLOYMENT=placeholder
          AZURE_OPENAI_API_VERSION=2024-10-21
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_DB=ci_placeholder_db
          POSTGRES_USER=ci_placeholder_user
          POSTGRES_PASSWORD=ci_placeholder_password
          EXTRACTOR_URL=http://extractor:8000
          EOF

      - name: docker compose build
        run: docker compose build
